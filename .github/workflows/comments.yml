name: Post Jira Comments

# Triggered by the dashboard's "Comment" button: it commits
# data/comment_queue.json.enc then dispatches this workflow. The job posts each
# queued comment to Jira (real @owner / CC mentions), then removes ONLY the
# items it posted from the latest queue (read-modify-write, so a concurrently
# queued batch is never clobbered).

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize runs so two dispatches can't race on the queue file.
concurrency:
  group: post-comments
  cancel-in-progress: false

jobs:
  post-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post comments to Jira
        env:
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL:  ${{ secrets.JIRA_BASE_URL }}
          # Needed to decrypt the encrypted CC recipients sheet (email_recipients.json.enc)
          SITE_PASSWORD:  ${{ secrets.SITE_PASSWORD }}
        run: python src/post_comments.py

      - name: Remove posted items from the queue
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main          # always edit the LATEST queue
            python src/clear_queue.py             # remove ONLY the keys we posted
            git add data/comment_queue.json.enc 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "Nothing to clear."; ok=1; break
            fi
            git commit -m "Clear posted comments $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then ok=1; break; fi
            echo "Push rejected (queue advanced) — retrying…"; sleep 2
          done
          [ "$ok" = "1" ] || echo "WARNING: could not clear queue after retries (next run will retry)."
